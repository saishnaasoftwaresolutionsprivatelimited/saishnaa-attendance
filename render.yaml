services:
  - type: web
    name: saishnaa-attendance
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_SECURE
        value: true
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: COMPANY_NAME
        value: SAISHNAA SOFTWARE SOLUTIONS PRIVATE LIMITED
      - key: COMPANY_SHORT_NAME
        value: SAISHNAA

